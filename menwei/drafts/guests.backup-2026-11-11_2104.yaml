# 老K 认识的熟客。开局示范和最后几位考题只从这里出，答案以这里为准，不经过模型。
# 玩家领来的客人如果在这里，也直接按这里的标注判断。
#
# name：名字    emoji：头像
# yes：符合的特征（填 config.yaml 里 attributes 的 id）；没写的特征一律算“不符合”
# unsure：说不准的特征。用到这些特征的规则，不会拿这位客人出题；玩家领来时交给模型判断
#
# 注意：在 config.yaml 新增特征后，要在这里给客人补标注；
#       一位客人都没标注过的特征，不会被用来出规则。

