# name：名字    emoji：头像
# yes：符合的特征（填 config.yaml 里 attributes 的 id）；没写的特征一律算“不符合”
# unsure：说不准的特征。用到这些特征的规则，不会拿这位客人出题；玩家领来时交给模型判断
